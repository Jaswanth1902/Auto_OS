<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette-web" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14141E" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0C0C14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06060A" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold-web" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9B7732"/>
    </linearGradient>
    <style>
      .serif-title { font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Playfair Display', 'Baskerville', 'Georgia', serif; font-weight: 400; }
      .serif-sub { font-family: 'Cormorant Garamond', 'Baskerville', 'Georgia', serif; font-style: italic; }
      .mono-tech { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#06060A"/>
  <rect width="1200" height="420" fill="url(#vignette-web)"/>

  <!-- Frame -->
  <rect x="24" y="24" width="1152" height="372" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.35"/>
  <rect x="28" y="28" width="1144" height="364" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="4,6" stroke-opacity="0.2"/>

  <!-- Corner Rosettes -->
  <g stroke="#C5A059" stroke-width="0.8" opacity="0.6">
    <path d="M20 24 h16 M24 20 v16"/>
    <path d="M1180 24 h-16 M1176 20 v16"/>
    <path d="M20 396 h16 M24 392 v16"/>
    <path d="M1180 396 h-16 M1176 392 v16"/>
    <circle cx="24" cy="24" r="3" fill="none"/>
    <circle cx="1176" cy="24" r="3" fill="none"/>
    <circle cx="24" cy="396" r="3" fill="none"/>
    <circle cx="1176" cy="396" r="3" fill="none"/>
  </g>

  <!-- Da Vinci Golden Ratio Viewport & Modular Web Grid (Left Visual) -->
  <g transform="translate(225, 210)" stroke="#C5A059" fill="none">
    <g stroke-width="0.4" stroke-opacity="0.15" stroke-dasharray="2,4">
      <circle cx="0" cy="0" r="165"/>
      <circle cx="0" cy="0" r="120"/>
      <circle cx="0" cy="0" r="75"/>
      <line x1="-180" y1="0" x2="180" y2="0"/>
      <line x1="0" y1="-160" x2="0" y2="160"/>
    </g>

    <!-- Web Viewport Display Frame -->
    <rect x="-85" y="-60" width="170" height="120" rx="4" stroke="url(#gold-web)" stroke-width="1.2" fill="#0E0E18" fill-opacity="0.8"/>
    <!-- Navigation Bar -->
    <line x1="-85" y1="-40" x2="85" y2="-40" stroke="#C5A059" stroke-width="0.6"/>
    <circle cx="-75" cy="-50" r="2" fill="#EF4444" stroke="none"/>
    <circle cx="-68" cy="-50" r="2" fill="#F59E0B" stroke="none"/>
    <circle cx="-61" cy="-50" r="2" fill="#10B981" stroke="none"/>

    <!-- Grid Layout Lines -->
    <rect x="-70" y="-30" width="45" height="75" stroke="#818CF8" stroke-width="0.8" stroke-dasharray="2,2"/>
    <rect x="-15" y="-30" width="85" height="35" stroke="#C5A059" stroke-width="0.6"/>
    <rect x="-15" y="12" width="85" height="33" stroke="#C5A059" stroke-width="0.6"/>

    <text x="-165" y="-140" fill="#C5A059" opacity="0.45" font-size="9" class="mono-tech">FIG. XVI — COMPONENT SYSTEM</text>
    <text x="-165" y="145" fill="#C5A059" opacity="0.4" font-size="8" class="mono-tech">MODULAR REACT ARCHITECTURE</text>
    <text x="-165" y="160" fill="#818CF8" opacity="0.5" font-size="8" class="mono-tech">ACCESSIBLE COMPONENT PATTERNS</text>
  </g>

  <!-- Typography (Center-Right) -->
  <g transform="translate(465, 0)">
    <text x="0" y="125" fill="#C5A059" font-size="11" letter-spacing="4" class="serif-title" opacity="0.85">
      MODULAR REACT ARCHITECTURE &amp; UI SYSTEMS
    </text>

    <text x="0" y="185" fill="#FDFBF7" font-size="44" letter-spacing="8" class="serif-title">
      WEB SYSTEMS CORE
    </text>

    <g transform="translate(0, 210)" stroke="#C5A059" opacity="0.6">
      <line x1="0" y1="0" x2="420" y2="0" stroke-width="0.8"/>
      <circle cx="210" cy="0" r="3" fill="#C5A059"/>
      <circle cx="105" cy="0" r="1.5" fill="#C5A059"/>
      <circle cx="315" cy="0" r="1.5" fill="#C5A059"/>
    </g>

    <text x="0" y="245" fill="#C5BEB3" font-size="14" letter-spacing="2" class="serif-title" opacity="0.9">
      REACT 18 • FULL-STACK STATE MANAGEMENT • ACCESSIBLE COMPONENTS
    </text>

    <text x="0" y="275" fill="#8C857B" font-size="13" class="serif-sub">
      Production web applications demonstrating clean state architecture, responsive UX, and accessible patterns.
    </text>

    <g transform="translate(0, 315)">
      <rect x="0" y="0" width="130" height="24" rx="2" fill="#12121E" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="65" y="16" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">REACT / REDUX</text>

      <rect x="142" y="0" width="135" height="24" rx="2" fill="#12121E" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="209" y="16" fill="#818CF8" font-size="10" text-anchor="middle" class="mono-tech">STATE PERSISTENCE</text>

      <rect x="289" y="0" width="145" height="24" rx="2" fill="#12121E" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="361" y="16" fill="#10B981" font-size="10" text-anchor="middle" class="mono-tech">LIGHTHOUSE &gt;90</text>
    </g>

    <text x="0" y="365" fill="#5C564E" font-size="9" letter-spacing="2" class="mono-tech">
      EX STRUCTURA RETIS • ANNO MMXXVI • OPEN FRONTEND
    </text>
  </g>
</svg>